{% extends "layout.html" %}
{% block content %}
<div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px;">
    <h2 style="color: #0b3d2e;">Add New Staff Member</h2>
    <p>This user will have access to the Nandulu CRM.</p>

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd;">

        <label>Temp Password</label>
        <input type="password" name="password" required style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd;">

        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; background: #0b3d2e; color: white; border: none; border-radius: 30px;">
            ✅ Create Account
        </button>
    </form>
</div>
{% endblock %}
