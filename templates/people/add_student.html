{% extends "layout.html" %}
{% block content %}
<div class="page-header">
    <h2 class="page-title">Enroll New Student</h2>
    <p class="page-subtitle">Add a new student to the system and assign a level.</p>
</div>

<div class="owlio-card form-card-wide">
    <form action="{{ url_for('enroll_student') }}" method="POST" enctype="multipart/form-data">
        <div class="form-grid-2">
            <div class="owlio-form-group">
                <label class="owlio-label">First Name</label>
                <input type="text" name="first_name" class="owlio-input" required>
            </div>
            <div class="owlio-form-group">
                <label class="owlio-label">Last Name</label>
                <input type="text" name="last_name" class="owlio-input" required>
            </div>
            <div class="owlio-form-group">
                <label class="owlio-label">Date of Birth</label>
                <input type="date" name="dob" class="owlio-input" required>
            </div>
            <div class="owlio-form-group">
                <label class="owlio-label">School Fee (K)</label>
                <input type="number" step="0.01" name="tuition_fee" class="owlio-input" placeholder="e.g. 5000" required>
            </div>
            <div class="owlio-form-group">
                <label class="owlio-label">Assign Level</label>
                <select name="class_id" class="owlio-select" required>
                    <option value="">-- Select Level --</option>
                    {% for env in environments %}
                    <option value="{{ env.id }}">{{ env.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="owlio-form-group" style="margin-top: 20px;">
            <label class="owlio-label">Authorized Pick-up Persons</label>
            <textarea name="pickup_auth" class="owlio-input" rows="3" placeholder="Names and phone numbers of people allowed to collect the child..."></textarea>
        </div>
        
        <div class="owlio-form-group" style="margin-top: 20px;">
            <label class="owlio-label">Profile Picture (Optional)</label>
            <input type="file" name="profile_pic" class="owlio-input" accept="image/*" style="padding: 10px;">
        </div>
        
        <button type="submit" class="owlio-btn" style="margin-top: 30px; width: 100%;">
            <i class="fas fa-user-plus"></i> Complete Enrollment
        </button>
    </form>
</div>

<style>
    .form-card-wide {
        max-width: 800px; 
        margin: 0 auto;
    }
    .form-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    @media (max-width: 768px) {
        .form-grid-2 {
            grid-template-columns: 1fr;
            gap: 15px;
        }
    }
</style>
{% endblock %}
