{% extends "layout.html" %}
{% block content %}
<div class="page-header">
    <h2 class="page-title">Create Parent Account</h2>
    <p class="page-subtitle">Generate secure login credentials for student guardians.</p>
</div>

<div class="owlio-card form-card">
    <form action="/people/create-parent" method="POST">
        <div class="owlio-form-group">
            <label class="owlio-label">Link to Student</label>
            <select name="student_id" class="owlio-select" required>
                <option value="">-- Select Student --</option>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.first_name }} {{ student.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <br>
        <div class="owlio-form-group">
            <label class="owlio-label">Parent Username</label>
            <input type="text" name="username" class="owlio-input" placeholder="e.g. Chitoti_Parent" required>
        </div>
        <br>
        <div class="owlio-form-group">
            <label class="owlio-label">Temporary Password</label>
            <input type="text" name="password" class="owlio-input" value="Pebbles2026" required>
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="owlio-btn" style="width: 100%;">
                <i class="fas fa-user-shield"></i> Activate Parent Portal
            </button>
        </div>
    </form>
</div>

<style>
    .form-card {
        max-width: 600px; 
        margin: 0 auto; 
    }
</style>
{% endblock %}
