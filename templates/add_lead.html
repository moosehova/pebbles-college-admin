<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Add New Lead | Purple Worth</title>
</head>
<body>
    <div class="sidebar">
        <h2>PURPLE WORTH</h2>
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
    
    <div class="main-content">
        <h1>Register New Loan Lead</h1>
        <form action="/save_lead" method="POST" class="loan-form">
            <label>Customer Name</label>
            <input type="text" name="name" required>
            
            <label>Desired Loan Amount (K)</label>
            <input type="number" name="amount" required>
            
            <button type="submit" class="btn-primary">Save Lead</button>
        </form>
    </div>
</body>
</html>
