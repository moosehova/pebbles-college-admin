{% extends "layout.html" %}
{% block content %}
<div class="edit-profile-container" style="max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h1 style="color: #0b3d2e; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px;">Edit Client: {{ lead.name }}</h1>
    <p style="color: #7f8c8d; font-size: 0.9rem;">
        📂 Application created on: {{ lead.created_at.strftime('%Y-%m-%d') }} |
        🕒 Last modified: {{ lead.updated_at.strftime('%Y-%m-%d %H:%M') }}
    </p>

    <form action="{{ url_for('update_lead', id=lead.id) }}" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            
            <div class="input-group">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Full Name</label>
                <input type="text" name="name" value="{{ lead.name }}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="input-group">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Phone Number</label>
                <input type="text" name="phone" value="{{ lead.phone }}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="input-group">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">NRC Number</label>
                <input type="text" name="nrc_number" value="{{ lead.nrc_number }}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="input-group">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Loan Amount (K)</label>
                <input type="number" name="amount" value="{{ lead.amount }}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            </div>

            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Repayment Due Date</label>
                <input type="date" name="due_date" value="{{ lead.due_date.strftime('%Y-%m-%d') if lead.due_date else '' }}" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 20px;">
            </div>
        </div>

        <div style="margin-top: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Interaction History / Notes</label>
            <textarea name="notes" rows="5" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">{{ lead.notes }}</textarea>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button type="submit" class="btn-primary" style="background: #0b3d2e; color: white; padding: 10px 25px; border: none; border-radius: 20px; cursor: pointer;">
                💾 Save Changes
            </button>
            <a href="{{ url_for('dashboard') }}" style="text-decoration: none; color: #636e72; padding: 10px 20px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
