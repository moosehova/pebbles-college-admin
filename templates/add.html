{% extends "layout.html" %}
{% block content %}
<div class="form-wrapper" style="max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <h1 style="margin-bottom: 30px; color: #2d3436; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px;">New Loan Application</h1>
    
    <form action="/save_lead" method="POST" enctype="multipart/form-data">
        
        <h3 style="color: #6c5ce7; margin-bottom: 20px;"><i class="fas fa-user"></i> Personal Information</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Full Name</label>
                <input type="text" name="name" placeholder="Enter Client Name" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;" required>
            </div>
            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Phone Number</label>
                <input type="text" name="phone" placeholder="e.g. 097..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">NRC Number</label>
                <input type="text" name="nrc_number" placeholder="000000/00/1" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Loan Amount (K)</label>
                <input type="number" name="amount" placeholder="K 0.00" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;" required>
            </div>
            <div class="input-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Repayment Due Date</label>
                <input type="date" name="due_date" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 20px;">
            </div>
        </div>

        <h3 style="color: #6c5ce7; margin-bottom: 20px;"><i class="fas fa-file-upload"></i> KYC Documents</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 30px;">
            <div>
                <label style="font-size: 0.85rem; color: #636e72;">NRC Copy</label>
                <input type="file" name="nrc_file" style="font-size: 0.8rem; margin-top: 5px;">
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #636e72;">Latest Payslip</label>
                <input type="file" name="payslip_file" style="font-size: 0.8rem; margin-top: 5px;">
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #636e72;">Bank Statement</label>
                <input type="file" name="bank_statement_file" style="font-size: 0.8rem; margin-top: 5px;">
            </div>
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Interaction History & Notes</label>
            <textarea name="notes" rows="4" placeholder="Enter background info, repayment terms, etc..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;"></textarea>
        </div>

        <div style="text-align: right;">
            <button type="submit" class="btn-primary" style="padding: 15px 40px; font-size: 1rem; border-radius: 30px; cursor: pointer;">🚀 Create Client Profile</button>
        </div>
    </form>
</div>
{% endblock %}
